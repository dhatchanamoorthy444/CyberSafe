<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSafe</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>🛡️ CyberSafe</h1>
      <span class="version">v2.0</span>
    </header>

    <main class="popup-main">
      <div class="input-section">
        <input
          type="text"
          id="url-input"
          class="url-input"
          placeholder="Enter URL to analyze..."
          autocomplete="off">
        <div class="button-group">
          <button id="analyze-btn" class="btn btn-primary">Analyze</button>
          <button id="current-tab-btn" class="btn btn-secondary" title="Analyze current tab">Current Tab</button>
        </div>
      </div>

      <div id="loading" class="state hidden">
        <div class="loader"></div>
        <p>Analyzing...</p>
      </div>

      <div id="error" class="state error hidden">
        <p id="error-text"></p>
      </div>

      <div id="results" class="state hidden">
        <div id="verdict" class="verdict"></div>
        <div id="findings" class="findings"></div>
      </div>
    </main>

    <footer class="popup-footer">
      <a href="#" id="full-page-link" target="_blank">Open Full Analysis</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
